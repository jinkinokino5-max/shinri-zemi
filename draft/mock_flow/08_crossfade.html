<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案08｜大判が1枚ずつ入れ替わる｜北大心理ゼミ トップページ モック</title>

<!-- ══════════════════════════════════════════════════════════════════
     案08｜大判が1枚ずつ入れ替わる（切り替え）

     考え方
       「流れ」ではなく「切り替わり」。大きな写真が1枚ずつ入れ替わり、
       右の名前一覧のうち、いま出ている1件だけが朱の下線で示される。
       写真と名前が連動するので、「どれが何なのか」が確実に分かる。

     ⚠ 動きの総量は4案で最も少ない。動きが苦手な人への負担が最も軽い。
     ⚠ 一方で、写真の質がそのまま画面に出る。
       良い写真が数枚そろって初めて効く案であり、
       現在 public/photos/ は0枚なので効果は未知数。

     ⚠ 自動で切り替わるものには停止手段が要る（WCAG 2.2.2）。
       5秒以上自動で動く表現は、利用者が止められなければならない。
       右下の「一時停止」がそれ。装飾ではなく要件である。

     ⚠ Mission / Vision / Value は一字一句、原文どおり（大本資料 0-1）
     ⚠ 書体・ウェイトは現行サイトから一切変更していない
     ══════════════════════════════════════════════════════════════════ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho&text=%E3%81%84%E3%81%8A%E3%81%8B%E3%81%8C%E3%81%8D%E3%81%91%E3%81%93%E3%81%99%E3%81%9B%E3%81%A7%E3%81%A8%E3%81%AA%E3%81%AB%E3%81%AE%E3%81%B6%E3%81%BE%E3%82%82%E3%82%89%E3%82%8B%E3%82%8C%E3%82%8D%E3%82%92%E5%87%BA%E5%8C%97%E5%8E%BB%E5%95%8F%E5%A0%B4%E5%A4%A7%E5%A6%84%E5%AD%A6%E5%B9%B8%E5%BD%A2%E5%BF%98%E6%83%B3%E6%89%80%E6%9C%80%E6%BA%A2%E7%94%9F%E7%B6%9A%E8%AA%B0%E9%81%8E%E9%87%8F&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">

<style>
/* ════════════════════════════════════════════════════════
   案08 固有
   ════════════════════════════════════════════════════════ */
.hero{
  display:grid;grid-template-columns:1.15fr 1fr;gap:var(--sp-8);align-items:center;
  max-width:1140px;margin-inline:auto;padding:var(--sp-8) var(--sp-4) var(--sp-12);
}
.hero__logo{max-width:320px;margin-bottom:var(--sp-4)}
.hero__h{font-size:clamp(26px,3.4vw,40px);font-weight:700;line-height:1.3;letter-spacing:-.02em}

/* ── 大判の舞台 ────────────────────────────────────── */
.stage{position:relative;aspect-ratio:4/3;border-radius:var(--radius);overflow:clip;
       background:var(--paper-card)}
.stage .ph{position:absolute;inset:0;aspect-ratio:auto;border-radius:0;
           opacity:0;transition:opacity 700ms var(--ease-out)}
.stage .ph.is-on{opacity:1}
/* ⚠ 舞台の上に文字を載せない。写真の色を邪魔しない（作品を正しく見せる）。
     名前は右の一覧側で示す。 */

/* 現在地の表示。⚠ 何枚中の何枚目かが分からないと、待てばよいのか判断できない。 */
.stage__idx{
  position:absolute;right:var(--sp-2);bottom:var(--sp-2);
  font:400 11px/1.4 var(--font-mono);letter-spacing:.1em;color:var(--ink);
  background:var(--paper);border-radius:var(--radius-pill);padding:.3em 1em;
  font-variant-numeric:tabular-nums;
}

/* ── 名前の一覧。写真と連動する ───────────────────────
   ⚠ 「いま出ているのはこれ」を色だけで示さない。
     朱の下線に加えて aria-current を付け、読み上げにも伝える。 */
.list{display:grid;gap:.1em;margin-top:var(--sp-4)}
.list a{
  text-decoration:none;font-size:clamp(17px,1.8vw,21px);font-weight:700;letter-spacing:.02em;
  line-height:1.7;display:inline-block;justify-self:start;
  border-bottom:2px solid transparent;color:var(--sub-on-light);   /* 生成り地 4.92 AA */
  transition:color var(--dur-hover) ease-out,border-color var(--dur-hover) ease-out;
}
.list a.is-on{color:var(--ink);border-bottom-color:var(--shu-on-light)}
.list a:hover{color:var(--ink)}

.more{margin-top:var(--sp-3)}

/* 停止ボタン。⚠ WCAG 2.2.2。装飾ではなく要件。 */
.pause{
  margin-top:var(--sp-4);display:inline-flex;align-items:center;gap:.6em;
  font:400 12px/1.5 var(--font-mono);letter-spacing:.12em;
  background:none;border:1.5px solid var(--ink);border-radius:var(--radius-pill);
  color:var(--ink);padding:.6em 1.4em;cursor:pointer;
  transition:background var(--dur-hover) ease-out,color var(--dur-hover) ease-out;
}
.pause:hover{background:var(--ink);color:var(--paper)}

@media(max-width:820px){
  .hero{grid-template-columns:1fr;gap:var(--sp-6)}
}

/* ════════════════════════════════════════════════════════
   動きの停止
   ⚠ 切り替えを止めると1枚しか見えなくなる。全枚数を並べて出す。
   ════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion: reduce){
  .stage{aspect-ratio:auto;display:grid;gap:var(--sp-2);overflow:visible}
  .stage .ph{position:relative;opacity:1;aspect-ratio:16/10;border-radius:var(--radius)}
  .stage__idx{display:none}
  .list a{color:var(--ink)}
  .pause{display:none}
}
</style>
</head>
<body>

<!-- ⚠ モック閲覧用の見出し。本番には入らない。 -->
<div class="mockbar">
  <p class="mockbar__no">CASE 08</p>
  <p class="mockbar__name">大判が1枚ずつ入れ替わる（切り替え）</p>
  <p class="mockbar__note">
    「流れ」ではなく「切り替わり」。大きな写真が1枚ずつ入れ替わり、
    <b>右の名前一覧のうち、いま出ている1件だけが朱の下線で示される。</b>写真と名前が連動するので「どれが何なのか」が確実に分かる。
    動きの総量は4案で最も少ない。
    <b>⚠ 写真の質がそのまま出る案。良い写真が数枚そろって初めて効く。</b>
    色つきの絵は CSS で描いた仮のもので、実写ではない。
  </p>
</div>

<main class="frame">
  <div data-slot="nav"></div>

  <!-- ══ ヒーロー：左に大判、右に宣言と一覧 ══ -->
  <section class="hero">
    <div class="stage" id="stage">
      <p class="stage__idx" id="stage-idx"></p>
    </div>

    <div>
      <svg class="logomark hero__logo" aria-hidden="true"><use href="#logomark"/></svg>
      <span class="vh">北大心理ゼミ</span>
      <p class="label">Mission</p>
      <!-- ⚠ 原文どおり。<span> は文字を1字も増減させていない。 -->
      <h1 class="hero__h has-kenten" style="margin-top:var(--sp-2)">
        大学生の溢れ出す<span class="kenten">妄想</span>を形にする
      </h1>

      <div class="list" id="list"></div>
      <p class="label more" id="more"></p>

      <!-- ⚠ WCAG 2.2.2：5秒以上自動で動くものは、利用者が止められなければならない。 -->
      <button class="pause" id="pause" type="button" aria-pressed="false">一時停止</button>
    </div>
  </section>

  <div data-slot="below"></div>
</main>

<script src="_shared.js"></script>
<script>
/* ⚠ 本番では lib/content.ts の集計を map するだけになる。 */
document.addEventListener('DOMContentLoaded', () => {

  /* ⚠ 舞台に出せるのは「写真がある活動」だけ。
       写真の無い活動を混ぜると空枠がフェードするだけになり、意味を成さない。
       だから一覧側には全21件を出し、舞台には写真がある分だけを回す。 */
  const shown = ACTIVITIES.filter(a => a.photo);

  const stage = document.getElementById('stage');
  const idxEl = document.getElementById('stage-idx');
  const list  = document.getElementById('list');

  /* 写真が1枚も無いとき。⚠ 空の舞台を出さず、正直に伝える。 */
  if (shown.length === 0) {
    stage.innerHTML =
      `<div class="ph ph--none is-on" style="display:grid;place-items:center">
         <span class="ph__cap" style="position:static">写真がまだ1枚もありません</span>
       </div>`;
  } else {
    stage.insertAdjacentHTML('afterbegin',
      shown.map((a, i) =>
        `<div class="ph ${a.tone} ${i === 0 ? 'is-on' : ''}"><span class="ph__cap">仮</span></div>`
      ).join(''));
  }

  /* 一覧は写真の有無にかかわらず全件。⚠ 写真が無い活動を隠さない。 */
  list.innerHTML = ACTIVITIES.map(a =>
    `<a href="#${a.slug}" data-slug="${a.slug}">${a.name}</a>`).join('');
  document.getElementById('more').textContent =
    `全 ${ACTIVITIES.length} 件（うち写真あり ${shown.length} 件）`;

  if (shown.length === 0) return;

  const photos = [...stage.querySelectorAll('.ph')];
  const links  = [...list.querySelectorAll('a')];
  let i = 0, timer = null;

  function show(n) {
    photos[i].classList.remove('is-on');
    const prev = links.find(l => l.dataset.slug === shown[i].slug);
    if (prev) { prev.classList.remove('is-on'); prev.removeAttribute('aria-current'); }

    i = n;

    photos[i].classList.add('is-on');
    const cur = links.find(l => l.dataset.slug === shown[i].slug);
    /* ⚠ 色だけでなく aria-current でも「いまこれ」を伝える。 */
    if (cur) { cur.classList.add('is-on'); cur.setAttribute('aria-current', 'true'); }

    idxEl.textContent = `${String(i + 1).padStart(2, '0')} / ${String(shown.length).padStart(2, '0')}`;
  }
  show(0);

  const start = () => { timer = setInterval(() => show((i + 1) % shown.length), 4000); };
  const stop  = () => { clearInterval(timer); timer = null; };

  /* ⚠ OSの「視差効果を減らす」が入っているときは自動再生しない。 */
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!calm.matches) start();

  /* 停止ボタン（WCAG 2.2.2） */
  const btn = document.getElementById('pause');
  btn.addEventListener('click', () => {
    if (timer) { stop(); btn.textContent = '再生'; btn.setAttribute('aria-pressed', 'true'); }
    else       { start(); btn.textContent = '一時停止'; btn.setAttribute('aria-pressed', 'false'); }
  });

  /* 名前をホバー／フォーカスすると、その写真に飛ぶ。
     ⚠ 一覧が「押せる目次」として機能することを示すための挙動。 */
  links.forEach(l => {
    const n = shown.findIndex(s => s.slug === l.dataset.slug);
    if (n < 0) return;                     /* 写真の無い活動は舞台を持たない */
    const jump = () => { if (timer) { stop(); show(n); start(); } else { show(n); } };
    l.addEventListener('mouseenter', jump);
    l.addEventListener('focus', jump);
  });
});
</script>
</body>
</html>
