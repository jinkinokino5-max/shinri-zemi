# ══════════════════════════════════════════════════════════════════
#  GitHub Pages への自動デプロイ
#  根拠：draft/ロードマップ.md 1-1 / P4
#
#  main に push されるたびに、ビルド → 検査 → 公開 を自動で行う。
#
#  ⚠ 検査（scripts/check-content.mjs）が失敗したらデプロイしない。
#    参考サイトが実測で失敗していた点（h1が無い・空、非公認の一文の欠落、
#    リンク切れ、altの無いimg）を含む。壊れたまま公開されるのを仕組みで防ぐ。
#
#  ⚠ 1年以内に Cloudflare Pages へ移行する（投稿機能のため）。
#    その際このファイルは差し替えるが、アプリ側のコードは変わらない。
# ══════════════════════════════════════════════════════════════════

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 手動実行も可能にしておく（イベント終了後の再ビルド等で使う）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1つに絞る。実行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ⚠ ジョブ全体で共有する。ビルドと検査で値がずれると、
    #   「ビルドは basePath 付き／検査は無し」となり誤検出で必ず落ちる（実際に起きた）。
    #   独自ドメインを設定したら、この2行を削除すること（BASE_PATH="" になる）。
    env:
      BASE_PATH: /shinri-zemi
    # ⚠ サイトのコードは output/website/ にある（2026-08-10 移動）。
    #   reference/ と draft/ はプロジェクト直下のままなので、
    #   scripts はそこから2階層上を見ている。
    defaults:
      run:
        working-directory: output/website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # ⚠ setup-node は defaults.working-directory を見ない。
          #   package-lock.json の場所を明示しないとキャッシュに失敗する。
          cache-dependency-path: output/website/package-lock.json

      - run: npm ci

      - name: ビルド（明朝サブセットの自動生成を含む）
        run: npm run build

      - name: 投稿→Markdown の検査（フェーズ6）
        # ⚠ 代表が承認したのにビルドが落ちる、という壊れ方を先に潰す。
        #   to-markdown.ts と lib/schema.ts の食い違いをここで検出する。
        run: npm run check:publish

      - name: 独自ページの検査（部活・PJ・イベント・作品）
        # ⚠ JS混入・外部参照・容量超過があればここで落とす。
        #   代表の確認を「人にしか判断できないこと」だけに絞るための仕組み。
        run: node scripts/check-custom-pages.mjs

      - name: 公開前の自動検査
        # ⚠ ここで落ちたらデプロイしない。
        run: node scripts/check-content.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./output/website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
