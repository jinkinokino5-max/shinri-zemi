<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>◯◯部</title>
  <style>
    /* CSSは自由に書けます。色も書体もレイアウトも好きにしてください。 */
    body { margin: 0; background: #101820; color: #f2f2f2;
           font-family: system-ui, sans-serif; line-height: 1.9; }
    .box { max-width: 800px; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-size: 3rem; line-height: 1.2; }
    /* JavaScript は使えませんが、アニメーションはCSSだけで書けます。 */
    h1 { animation: in .8s cubic-bezier(.16,1,.3,1) both; }
    @keyframes in { from { opacity: 0; translate: 0 1rem } to { opacity: 1; translate: 0 0 } }
    /* 動きを止めたい人への配慮。これは入れてください。 */
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
</head>
<body>
  <div class="box">
    <h1>◯◯部</h1>
    <p>ここに紹介文を書きます。</p>
    <!-- 画像は同じフォルダに置いて、相対パスで読み込みます。 -->
    <!-- <img src="photo.jpg" alt="活動のようす"> -->
  </div>
</body>
</html>
